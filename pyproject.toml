[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "supercalc-workbench"
version = "0.1.0"
description = "Offline programmable mathematics workbench for Windows"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "SuperCalc Contributors" }]
dependencies = [
  "PySide6==6.11.2",
  "sympy==1.14.0",
  "mpmath==1.3.0",
  "numpy==2.5.3",
  "matplotlib==3.11.2",
  "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
  "hypothesis==6.170.5",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "pyinstaller==6.21.0",
]

[project.scripts]
supercalc = "supercalc_cli.main:main"
supercalc-gui = "supercalc_gui.app:main"
supercalc-worker = "supercalc_cli.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/supercalc_core", "src/supercalc_cli", "src/supercalc_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

